<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFlash KV injection: every draft layer sees the full prefix</title>
<style>@font-face{font-family:"PencilPete";src:url("../fonts/PencilPete.ttf") format("truetype");}</style>
<style>
:root{
  --_serif: var(--serif, Georgia, 'Iowan Old Style', 'Times New Roman', serif);
  --_ink: var(--ink, #2A2A26);
  --chalk:#F5F4EF;
  --chalk-dim:rgba(245,244,239,.55);
  --board:#12291d;
  --frame:#7A5230;
}
*{box-sizing:border-box}
html{zoom:0.8}
body{
  margin:0;padding:0 0 4px;background:transparent;
  font-family:var(--_serif);
}
.wrap{max-width:940px;margin:0 auto}
/* opened directly (not in an iframe): center the board in the window */
body.standalone{min-height:calc(100vh / 0.8);display:flex;align-items:center;justify-content:center;padding:24px 12px}
body.standalone .wrap{width:100%}
.board{background:var(--frame);border-radius:16px;padding:12px;position:relative}
.slate{
  position:relative;font-family:'PencilPete',cursive;
  border-radius:10px;padding:30px 34px 40px;color:var(--chalk);
  background:
    radial-gradient(ellipse 60% 40% at 20% 30%, rgba(255,255,255,0.045), transparent 60%),
    radial-gradient(ellipse 50% 45% at 75% 70%, rgba(255,255,255,0.035), transparent 60%),
    radial-gradient(ellipse 40% 30% at 55% 15%, rgba(255,255,255,0.03), transparent 60%),
    var(--board);
}
.diagram{width:100%}
.diagram svg{width:100%;height:auto;display:block}
.st{fill:var(--chalk)}
.sd{fill:var(--chalk-dim)}
.cbox{fill:rgba(245,244,239,.06);stroke:rgba(245,244,239,.75);stroke-width:1.5}
.cboxd{fill:rgba(245,244,239,.03);stroke:rgba(245,244,239,.5);stroke-width:1.5;stroke-dasharray:6 5}
.cmask{fill:rgba(245,244,239,.03);stroke:rgba(245,244,239,.45);stroke-width:1.5;stroke-dasharray:4 4}
.flow{stroke:rgba(245,244,239,.7);stroke-width:1.7;fill:none}
.flowd{stroke:rgba(245,244,239,.55);stroke-width:1.5;stroke-dasharray:6 5;fill:none}
[data-t]{opacity:0;transition:opacity .45s ease,transform .45s ease;transform-box:fill-box;transform-origin:center;transform:translateY(4px)}
[data-t].on{opacity:1;transform:translateY(0)}
.replay{
  position:absolute;bottom:12px;right:20px;z-index:2;
  display:flex;align-items:center;gap:9px;
  background:none;border:none;cursor:pointer;padding:0;
}
.replay svg{display:block;filter:url(#slip2)}
.replay .eraser{
  width:34px;height:17px;border-radius:3px;flex:none;
  background:linear-gradient(#e9e7e2 0%, #cfccc5 58%, #57544d 59%, #45423c 100%);
  box-shadow:0 1.5px 2.5px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.7);
}
.replay:hover .eraser{filter:brightness(1.08)}
.replay:focus-visible{outline:2px solid rgba(245,244,239,.6);outline-offset:3px}
@media(prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
}
</style>
</head>
<body>
<script>if(window.self===window.top)document.documentElement.classList.add("standalone"),document.body.classList.add("standalone");</script>
<svg width="0" height="0" style="position:absolute">
  <filter id="slip1" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.010" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="slip2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="slip3" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>
<div class="wrap">

        <text class="st" x="28" y="38" font-size="21" transform="rotate(-0.4 28 38)" filter="url(#slip3)">KV injection: every draft layer sees the full prefix</text>

          </g>

            <text class="st" x="76" y="190" font-size="16" text-anchor="middle" transform="rotate(0.7 76 185)">fastest</text>
          </g>
          <g class="el" data-t="1100">
            <rect class="cbox" x="28" y="208" width="96" height="30" rx="8" transform="rotate(-0.6 76 223)"/>
            <text class="st" x="76" y="228" font-size="16" text-anchor="middle" transform="rotate(-0.6 76 223)">way</text>
          </g>

            <rect class="cbox" x="28" y="246" width="96" height="30" rx="8" transform="rotate(0.9 76 261)"/>

          </g>
        </g>
        <path class="flow" data-t="1700" filter="url(#slip3)" d="M130,205 H170 M162,199 L172,205 L162,211"/>

          <g class="el" data-t="2550">

            <text class="st" x="412" y="158" font-size="15" text-anchor="middle">h&#8321;</text>
          </g>
          <g class="el" data-t="3000">
            <rect class="cbox" x="390" y="176" width="44" height="26" rx="7"/>
            <text class="st" x="412" y="194" font-size="15" text-anchor="middle">h&#8322;</text>
          </g>
          <g class="el" data-t="3450">
            <rect class="cbox" x="390" y="212" width="44" height="26" rx="7"/>
            <text class="st" x="412" y="230" font-size="15" text-anchor="middle">h&#8323;</text>
          </g>
          <g class="el" data-t="3900">
            <rect class="cbox" x="390" y="248" width="44" height="26" rx="7"/>
            <text class="st" x="412" y="266" font-size="15" text-anchor="middle">h&#8324;</text>
          </g>
        </g>
        <path class="flow" data-t="2700" filter="url(#slip3)" d="M334,165 L384,153 M376,147 L386,153 L377,159"/>
        <path class="flow" data-t="3150" filter="url(#slip3)" d="M334,190 L384,189 M376,183 L386,189 L376,195"/>
        <path class="flow" data-t="3600" filter="url(#slip3)" d="M334,215 L384,225 M375,220 L386,225 L376,231"/>
        <path class="flow" data-t="4050" filter="url(#slip3)" d="M334,240 L384,261 M375,255 L386,261 L376,266"/>

        <g class="el" data-t="4300">
          <g transform="rotate(0.5 570 210)">

        <g filter="url(#slip2)">
          <g class="el" data-t="8150">
            <rect class="cbox" x="615" y="62" width="64" height="30" rx="8" transform="rotate(0.8 647 77)"/>
            <text class="st" x="647" y="82" font-size="15" text-anchor="middle" transform="rotate(0.8 647 77)">anchor</text>
          </g>
          <g class="el" data-t="8350">
            <rect class="cmask" x="686" y="62" width="58" height="30" rx="8" transform="rotate(-0.7 715 77)"/>
            <text class="sd" x="715" y="82" font-size="15" text-anchor="middle" transform="rotate(-0.7 715 77)">MASK</text>
          </g>
          <g class="el" data-t="8550">
            <rect class="cmask" x="751" y="62" width="58" height="30" rx="8" transform="rotate(0.9 780 77)"/>
            <text class="sd" x="780" y="82" font-size="15" text-anchor="middle" transform="rotate(0.9 780 77)">MASK</text>
          </g>
          <g class="el" data-t="8750">
            <rect class="cmask" x="816" y="62" width="58" height="30" rx="8" transform="rotate(-0.8 845 77)"/>
            <text class="sd" x="845" y="82" font-size="15" text-anchor="middle" transform="rotate(-0.8 845 77)">MASK</text>
          </g>
          <g class="el" data-t="8950">
            <rect class="cmask" x="881" y="62" width="58" height="30" rx="8" transform="rotate(0.7 910 77)"/>
            <text class="sd" x="910" y="82" font-size="15" text-anchor="middle" transform="rotate(0.7 910 77)">MASK</text>
          </g>
        </g>
        <path class="flow" data-t="9150" filter="url(#slip3)" d="M800,96 V112 M794,106 L800,116 L806,106"/>
        <text class="sd" data-t="9150" x="812" y="110" font-size="13">block in</text>

        <!-- draft stack, layer 1 on top, built top down -->
        <g filter="url(#slip1)">
          <g class="el" data-t="5450">
            <rect class="cbox" x="700" y="120" width="200" height="48" rx="9" transform="rotate(-0.6 800 144)"/>
            <text class="st" x="800" y="149" font-size="17" text-anchor="middle" transform="rotate(-0.6 800 144)">draft layer 1</text>
          </g>
          <g class="el" data-t="5700">
            <rect class="cbox" x="700" y="184" width="200" height="48" rx="9" transform="rotate(0.5 800 208)"/>
            <text class="st" x="800" y="213" font-size="17" text-anchor="middle" transform="rotate(0.5 800 208)">draft layer 2</text>
          </g>
          <g class="el" data-t="5950">
            <rect class="cbox" x="700" y="248" width="200" height="48" rx="9" transform="rotate(-0.4 800 272)"/>
            <text class="st" x="800" y="277" font-size="17" text-anchor="middle" transform="rotate(-0.4 800 272)">draft layer 3</text>
          </g>
          <g class="el" data-t="6200">
            <rect class="cbox" x="700" y="312" width="200" height="48" rx="9" transform="rotate(0.6 800 336)"/>
            <text class="st" x="800" y="341" font-size="17" text-anchor="middle" transform="rotate(0.6 800 336)">draft layer 4</text>
          </g>
          <g class="el" data-t="6450">
            <rect class="cbox" x="700" y="376" width="200" height="48" rx="9" transform="rotate(-0.5 800 400)"/>
            <text class="st" x="800" y="405" font-size="17" text-anchor="middle" transform="rotate(-0.5 800 400)">draft layer 5</text>

        <!-- KV injection fan-out, into EVERY layer, top down -->
        <g filter="url(#slip2)">
          <path class="flowd" data-t="6800" d="M660,205 Q 682,148 695,145 M687,139 L698,144 L688,151"/>
          <path class="flowd" data-t="7050" d="M660,208 Q 680,204 695,207 M687,201 L698,207 L687,213"/>
          <path class="flowd" data-t="7300" d="M660,211 Q 680,264 695,270 M686,264 L698,270 L687,276"/>
          <path class="flowd" data-t="7550" d="M660,214 Q 682,330 695,334 M687,328 L698,334 L688,340"/>
          <path class="flowd" data-t="7800" d="M660,217 Q 684,394 695,398 M687,392 L698,398 L688,404"/>
        </g>
        <g class="sd" font-size="11.5" filter="url(#slip3)">
          <text data-t="6800" x="672" y="132">KV</text>
          <text data-t="7050" x="672" y="196">KV</text>
          <text data-t="7300" x="672" y="254">KV</text>
          <text data-t="7550" x="672" y="320">KV</text>
          <text data-t="7800" x="672" y="384">KV</text>
        </g>

        <!-- output row, leaves at the bottom: get to school quickly -->
        <g filter="url(#slip1)">
          <g class="el" data-t="9450">
            <rect class="cbox" x="700" y="502" width="58" height="30" rx="8" transform="rotate(-1 729 517)"/>

            <text class="st" x="793" y="522" font-size="14" text-anchor="middle" transform="rotate(0.8 793 517)">to</text>
          </g>
          <g class="el" data-t="9950">
            <rect class="cbox" x="828" y="502" width="58" height="30" rx="8" transform="rotate(-0.7 857 517)"/>
            <text class="st" x="857" y="522" font-size="14" text-anchor="middle" transform="rotate(-0.7 857 517)">school</text>
          </g>
          <g class="el" data-t="10200">
            <rect class="cbox" x="892" y="502" width="58" height="30" rx="8" transform="rotate(1 921 517)"/>
            <text class="st" x="921" y="522" font-size="14" text-anchor="middle" transform="rotate(1 921 517)">quickly</text>

            <text class="sd" x="48" y="490" font-size="15" filter="url(#slip2)">and injects at the first layer only.</text>
            <text class="sd" x="48" y="514" font-size="13">signal fades in deeper layers</text>
          </g>
        </g>
      </svg>
    </div>
  </div></div>
</div>

<script>
(function(){
  var els = Array.prototype.slice.call(document.querySelectorAll('[data-t]'));
  // idempotent paint(t): data-t is in ms, every .el is on once t passes it
  var END = 11.6;
  function paint(t){ els.forEach(function(e){ e.classList.toggle('on', t * 1000 >= +e.getAttribute('data-t')); }); }
  var t0 = performance.now(), raf = null;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tick(){
    var t = (performance.now() - t0) / 1000;
    if (t >= END){ paint(END); raf = null; return; }
    paint(t); raf = requestAnimationFrame(tick);
  }
  function play(){
    if (raf) cancelAnimationFrame(raf);
    if (reduced){ paint(END); return; }
    t0 = performance.now(); paint(0); raf = requestAnimationFrame(tick);
  }
  document.getElementById('replay').addEventListener('click', play);
  play();
  window.addEventListener('beforeprint', function(){ if (raf) cancelAnimationFrame(raf); paint(1e9); });

  function postHeight(){
    parent.postMessage({
      chalkHeight: Math.ceil(document.body.getBoundingClientRect().height),
      chalkSrc: location.pathname.split('/').pop()
    }, '*');
  }
  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(postHeight);
  setTimeout(postHeight, 1500);
})();
</script>
