<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figure 7 — The best pet: strict vs relaxed verification</title>
<style>@font-face{font-family:"PencilPete";src:url("PencilPete.ttf") format("truetype");}</style>
<style>
:root{
  --_serif: var(--serif, Georgia, 'Iowan Old Style', 'Times New Roman', serif);
  --chalk:#F5F4EF;
  --chalk-dim:rgba(245,244,239,.6);
  --chalk-faint:rgba(245,244,239,.35);
  --board:#12291d;
  --frame:#7A5230;
}
*{box-sizing:border-box}
html{zoom:0.8}
body{margin:0;padding:0 0 4px;background:transparent;font-family:var(--_serif)}
.wrap{max-width:940px;margin:0 auto}
.board{background:var(--frame);border-radius:16px;padding:12px;position:relative}
.slate{
  position:relative;font-family:'PencilPete',cursive;
  border-radius:10px;padding:26px 34px 30px;color:var(--chalk);
  background:
    radial-gradient(ellipse 60% 40% at 20% 30%, rgba(255,255,255,0.045), transparent 60%),
    radial-gradient(ellipse 50% 45% at 75% 70%, rgba(255,255,255,0.035), transparent 60%),
    radial-gradient(ellipse 40% 30% at 55% 15%, rgba(255,255,255,0.03), transparent 60%),
    var(--board);
}
.setup{font-size:1.35rem;font-weight:700;letter-spacing:.07em;text-align:center;margin-bottom:4px}
.setup .q{color:var(--chalk-dim);font-weight:400}
.given{font-size:1.05rem;color:var(--chalk-dim);text-align:center;margin-bottom:14px}
.modes{display:flex;justify-content:center;gap:12px;margin-bottom:18px}
.mode{
  font-family:'PencilPete',cursive;font-size:1.15rem;font-weight:700;letter-spacing:.08em;
  color:var(--chalk-dim);background:none;cursor:pointer;
  border:1.7px dashed rgba(245,244,239,.45);border-radius:10px 8px 11px 7px;padding:7px 18px;
}
.mode.on{color:var(--chalk);border-style:solid;border-color:rgba(245,244,239,.85);background:rgba(245,244,239,.07)}
.stage{display:flex;justify-content:center;align-items:flex-end;gap:70px;height:230px;margin-bottom:6px}
.pet{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.pet .pic{line-height:1;transition:font-size .6s cubic-bezier(.22,1,.36,1);}
.pet .share{font-size:1.5rem;font-weight:700;color:var(--chalk);transition:opacity .3s}
.pet .name{font-size:1.15rem;color:var(--chalk-dim);letter-spacing:.1em}
.verdict{font-size:1.2rem;text-align:center;color:var(--chalk);min-height:28px}
.verdict .dim{color:var(--chalk-dim)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="slip1" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.010" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="slip2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="slip3" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>
<div class="wrap">
  <div class="board"><div class="slate">
    <div class="setup">"The best pet is a <span class="q">___</span>"</div>
    <div class="given">target model: cat 50% &middot; dog 50% &nbsp;&nbsp;|&nbsp;&nbsp; draft model prefers dog: 80%</div>

    <div class="modes">
      <button class="mode on" id="mStrict" type="button">strict rejection sampling</button>
      <button class="mode" id="mRelax" type="button">relaxed rule</button>
    </div>

    <div class="stage">
      <div class="pet">
        <div class="pic" id="catPic">🐈</div>
        <div class="share" id="catShare">50%</div>
        <div class="name">CAT</div>
      </div>
      <div class="pet">
        <div class="pic" id="dogPic">🐕</div>
        <div class="share" id="dogShare">50%</div>
        <div class="name">DOG</div>
      </div>
    </div>

    <div class="verdict" id="verdict"></div>
  </div></div>
</div>

<script>
(function(){
  var catPic = document.getElementById('catPic'), dogPic = document.getElementById('dogPic');
  var catShare = document.getElementById('catShare'), dogShare = document.getElementById('dogShare');
  var verdict = document.getElementById('verdict');
  var mStrict = document.getElementById('mStrict'), mRelax = document.getElementById('mRelax');

  function size(p){ return (40 + 130 * p) + 'px'; }  // emoji font-size scales with output share

  function render(mode){
    mStrict.classList.toggle('on', mode === 'strict');
    mRelax.classList.toggle('on', mode === 'relax');
    var dog = mode === 'strict' ? 0.5 : 0.8;
    var cat = 1 - dog;
    catPic.style.fontSize = size(cat);
    dogPic.style.fontSize = size(dog);
    catShare.textContent = Math.round(cat*100) + '%';
    dogShare.textContent = Math.round(dog*100) + '%';
    verdict.innerHTML = mode === 'strict'
      ? 'the output keeps the target\'s 50/50'
      : 'the best pet becomes a dog';
  }

  mStrict.addEventListener('click', function(){ render('strict'); });
  mRelax.addEventListener('click', function(){ render('relax'); });
  render('strict');

  function postHeight(){
    parent.postMessage({
      chalkHeight: Math.ceil(document.body.getBoundingClientRect().height),
      chalkSrc: location.pathname.split('/').pop()
    }, '*');
  }
  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(postHeight);
  setTimeout(postHeight, 1500);
})();
</script>
<script>
(function(){
  // hand-drawn slips: long strokes are harder to draw straight, so the longer
  // the element, the more likely (and eventually certain) a waver somewhere.
  var els = document.querySelectorAll('.slate span, .slate button, .slate td, .slate th, .slate .tlabel, .slate .tline, .slate .panettl, .slate .outerttl, .slate .note, .slate .pic, .slate .share, .slate .name, .slate .verdict, .slate .setup, .slate .given, .slate .bar, .slate .seg, .slate .card, .slate .pill, .slate .pane, .slate .panel, .slate .trow, .slate .outer, .slate .chunk');
  var slips = ['url(#slip1)', 'url(#slip2)', 'url(#slip3)'];
  els.forEach(function(el, i){
    var w = el.offsetWidth || 0;
    var r = ((i * 61 + 17) % 100) / 100;
    var pClean = w < 60 ? 0.85 : w < 160 ? 0.5 : w < 280 ? 0.15 : 0;
    if (r < pClean) return;
    el.style.filter = slips[i % 3];
  });
})();
</script>
</body>
</html>
