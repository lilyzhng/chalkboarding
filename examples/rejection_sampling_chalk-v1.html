<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rejection sampling</title>
<style>@font-face{font-family:"PencilPete";src:url("PencilPete.ttf") format("truetype");}</style>
<style>
:root{
  --chalk:#F5F4EF;
  --chalk-dim:rgba(245,244,239,.55);
  --board:#12291d;
  --frame:#7A5230;
  --good:#cfe4bd;
  --bad:#e8b9a8;
}
*{box-sizing:border-box}
html{zoom:0.8}
body{margin:0;padding:0;background:transparent;font-family:Georgia,serif}
.wrap{max-width:940px;margin:0 auto}
.board{background:var(--frame);border-radius:16px;padding:12px;position:relative}
.slate{
  position:relative;font-family:'PencilPete',cursive;
  border-radius:10px;padding:26px 34px 24px;color:var(--chalk);
  background:
    radial-gradient(ellipse 60% 40% at 20% 30%, rgba(255,255,255,0.045), transparent 60%),
    radial-gradient(ellipse 50% 45% at 75% 70%, rgba(255,255,255,0.035), transparent 60%),
    var(--board);
}
.title{font-size:1.35rem;font-weight:700;letter-spacing:.08em;transform:rotate(-0.3deg)}
.sentence{
  display:flex;gap:14px;justify-content:center;align-items:flex-start;
  margin-top:34px; /* reserved space for corrections above */
  min-height:190px;
}
.tokcol{display:flex;flex-direction:column;align-items:center;gap:8px}
.chipwrap{position:relative;display:inline-block}
.chip{
  border:1.8px solid rgba(245,244,239,.8);border-radius:10px 8px 11px 7px;
  padding:5px 13px;font-size:1.3rem;font-weight:700;color:var(--chalk);
  display:inline-block;text-align:center;
  background:rgba(245,244,239,.05);white-space:nowrap;
  opacity:0;transition:opacity .4s, border-color .3s, color .3s;
}
.chip.show{opacity:1}
.chip.prefix{background:rgba(245,244,239,.85);color:#12291d;border-color:rgba(245,244,239,.9);opacity:1}
.chip.checking{box-shadow:0 0 0 3px rgba(245,244,239,.18)}
.chip.dead{border-style:dashed;border-color:rgba(232,150,120,.85);color:var(--bad);text-decoration:line-through}
.chip.gone{opacity:.3;border-style:dashed;color:var(--chalk-dim);text-decoration:line-through}
.correction{
  position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;line-height:1;
  opacity:0;transition:opacity .5s;pointer-events:none;
}
.correction.show{opacity:1}
.correction .word{font-size:1.35rem;font-weight:700;color:var(--good);white-space:nowrap}
.correction .caret{font-size:1.1rem;color:var(--good);margin-top:-2px}
.grade{display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;transition:opacity .4s}
.grade.show{opacity:1}
.grade .bars{display:flex;align-items:flex-end;gap:9px;height:88px}
.grade .barcol{display:flex;flex-direction:column;align-items:center;gap:2px}
.grade .bval{font-size:.82rem;color:var(--chalk-dim);line-height:1}
.grade .bar{width:16px;border-radius:3px 3px 1px 1px}
.grade .bar.p{background:rgba(245,244,239,.9)}
.grade .bar.q{border:1.6px dashed rgba(245,244,239,.65);background:rgba(245,244,239,.08)}
.grade .mark{font-size:1.35rem;line-height:1.1}
.grade.okc .mark{color:var(--good)}
.grade.no .mark{color:var(--bad)}
.grade.dim{opacity:.4}
.grade .acc{font-size:.95rem;color:var(--chalk-dim)}
.barlegend{position:absolute;left:26px;bottom:14px;display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--chalk-dim)}
.barlegend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.barlegend .sw.p{background:rgba(245,244,239,.9)}
.barlegend .sw.q{border:1.6px dashed rgba(245,244,239,.65)}
.barlegend .sw.a{visibility:hidden}
.barlegend sub{font-size:.72em}
.outline{margin-top:14px;font-size:1.1rem;text-align:left;min-height:30px;padding-left:290px}
.outline .k{color:var(--chalk-dim);font-size:1.02rem;letter-spacing:.08em;margin-right:10px}
.replay{
  position:absolute;bottom:14px;right:24px;z-index:2;
  display:flex;align-items:center;gap:9px;
  background:none;border:none;cursor:pointer;padding:0;
}
.replay svg{display:block}
.replay .eraser{
  width:34px;height:17px;border-radius:3px;flex:none;
  background:linear-gradient(#e9e7e2 0%, #cfccc5 58%, #57544d 59%, #45423c 100%);
  box-shadow:0 1.5px 2.5px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.7);
}
@media(max-width:640px){
  html{zoom:.55}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="board"><div class="slate">
    <button class="replay" id="replay" type="button" aria-label="replay"><svg viewBox="0 0 24 24" width="22" height="22" fill="none"><path d="M20.49 15 a9 9 0 1 1 -2.12 -9.36 L23 10" stroke="#F5F4EF" stroke-width="1.8" stroke-linecap="round" fill="none"/><polyline points="23 4 23 10 17 10" stroke="#F5F4EF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span class="eraser"></span></button>

    <div class="title">rejection sampling</div>

    <div class="sentence" id="sentence"></div>
    <div class="outline"><span class="k">OUTPUT</span><span id="output">NeurIPS 2026 is in</span></div>
    <div class="barlegend"><span><span class="sw p"></span>p(x<sub>i</sub>), the target model's probability</span><span><span class="sw q"></span>q(x<sub>i</sub>), the draft model's probability</span><span><span class="sw a"></span>a(x<sub>i</sub>) = min(1, p/q), the accept probability</span></div>
  </div></div>
</div>

<script>
(function(){
  var PREFIX = ['NeurIPS', '2026', 'is'];
  var TOKS = [
    {w:'in',         p:'0.95', q:'0.90', a:'1.00', kind:'ok'},
    {w:'San Diego',  p:'0.04', q:'0.75', a:'0.05', kind:'no', repl:'Sydney'},
    {w:',',          p:'0.90', q:'0.92', a:'0.98', kind:'dim'},
    {w:'California', p:'0.03', q:'0.80', a:'0.04', kind:'dim'}
  ];
  var OUT0 = 'NeurIPS 2026 is';
  var OUTNEXT = '<span style="opacity:.5">, Australia</span><span style="opacity:.4;font-size:.75em"> &middot; next cycle</span>';

  var sentence = document.getElementById('sentence');
  var output = document.getElementById('output');
  var chips = [], corr = null, gradeEls = [];

  function build(){
    sentence.innerHTML = '';
    chips = []; gradeEls = []; corr = null;
    PREFIX.forEach(function(w){
      var col = document.createElement('span'); col.className = 'tokcol';
      col.innerHTML = '<span class="chipwrap"><span class="chip prefix">' + w + '</span></span>';
      sentence.appendChild(col);
    });
    TOKS.forEach(function(t){
      var col = document.createElement('span'); col.className = 'tokcol';
      var wrap = '<span class="chipwrap">';
      if (t.repl){
        wrap += '<span class="correction" id="corr"><span class="word">' + t.repl + '</span><span class="caret">&#8963;</span></span>';
      }
      wrap += '<span class="chip">' + t.w + '</span></span>';
      var mark = t.kind === 'ok' ? '&#10003;' : (t.kind === 'no' ? '&#10007;' : '&ndash;');
      var ph = Math.round(parseFloat(t.p) * 60) + 4;
      var qh = Math.round(parseFloat(t.q) * 60) + 4;
      col.innerHTML = wrap +
        '<span class="grade">' +
          '<span class="bars">' +
            '<span class="barcol"><span class="bval">' + t.p + '</span><span class="bar p" style="height:' + ph + 'px"></span></span>' +
            '<span class="barcol"><span class="bval">' + t.q + '</span><span class="bar q" style="height:' + qh + 'px"></span></span>' +
          '</span>' +
          '<span class="mark">' + mark + '</span>' +
          '<span class="acc">a = ' + t.a + '</span>' +
        '</span>';
      sentence.appendChild(col);
      chips.push(col.querySelector('.chip'));
      if (t.repl) corr = col.querySelector('.correction');
      gradeEls.push(col.querySelector('.grade'));
    });
  }

  var steps = [
    [0.4, function(){ chips.forEach(function(c,i){ setTimeout(function(){ c.classList.add('show'); }, i*140); }); }],
    // in: accepted
    [1.5, function(){ chips[0].classList.add('checking'); }],
    [2.2, function(){ chips[0].classList.remove('checking');
                      gradeEls[0].classList.add('show','okc');
                      output.textContent = OUT0 + ' in'; }],
    // San Diego: rejected, Sydney resampled
    [3.0, function(){ chips[1].classList.add('checking'); }],
    [3.8, function(){ chips[1].classList.remove('checking'); chips[1].classList.add('dead');
                      gradeEls[1].classList.add('show','no'); }],
    [4.6, function(){ corr.classList.add('show'); output.textContent = OUT0 + ' in Sydney'; }],
    // rest of the draft discarded, unchecked
    [5.5, function(){ gradeEls[2].classList.add('show','dim'); gradeEls[3].classList.add('show','dim'); }],
    [6.1, function(){ chips[2].classList.add('gone'); chips[3].classList.add('gone'); }],
    // the target finishes the sentence in later cycles
    [7.0, function(){ output.innerHTML = OUT0 + ' in Sydney' + OUTNEXT; }],
  ];
  var timers = [];
  function stopAll(){ timers.forEach(clearTimeout); timers = []; }
  function play(){
    stopAll(); build();
    output.textContent = OUT0;
    steps.forEach(function(st){ timers.push(setTimeout(st[1], st[0]*1000)); });
  }
  function finalState(){
    stopAll(); build();
    chips.forEach(function(c){ c.classList.add('show'); });
    chips[1].classList.add('dead'); chips[2].classList.add('gone'); chips[3].classList.add('gone');
    gradeEls[0].classList.add('show','okc'); gradeEls[1].classList.add('show','no');
    gradeEls[2].classList.add('show','dim'); gradeEls[3].classList.add('show','dim');
    corr.classList.add('show');
    output.innerHTML = OUT0 + ' in Sydney' + OUTNEXT;
  }

  document.getElementById('replay').addEventListener('click', play);
  play();

  window.addEventListener('beforeprint', function(){ try{ finalState(); }catch(e){} });
  if (location.search.indexOf('final') !== -1) setTimeout(finalState, 300);

  function postHeight(){
    parent.postMessage({
      chalkHeight: Math.ceil(document.body.getBoundingClientRect().height),
      chalkSrc: location.pathname.split('/').pop()
    }, '*');
  }
  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(postHeight);
  setTimeout(postHeight, 1500);
})();
</script>
</body>
</html>
